steps:
  - label: Build and Upload to TestFlight
    command: .buildkite/commands/build-and-upload-to-testflight.sh
    plugins:
      - automattic/a8c-ci-toolkit#8.0.1
      - automattic/nvm#0.3.0
    agents:
      queue: mac
    env:
      IMAGE_ID: xcode-27.2-v3
    artifact_paths:
      - "build/*.ipa"
      - "build/*.app.dSYM.zip"
      - "build/*.pkg"
